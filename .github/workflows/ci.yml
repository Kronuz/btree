name: CI
on:
  push:
    branches: [main, master, 'quest/**']
  pull_request:
  workflow_dispatch:
    inputs:
      nightly: { type: boolean, default: false }
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    uses: Kronuz/cpp-libraries/.github/workflows/cmake.yml@main
    with:
      nightly: ${{ inputs.nightly || false }}
      # These containers provide no concurrent mutation API.
      tsan: false
      asan_cxx_flags: -O1 -fsanitize=object-size,pointer-overflow -fno-sanitize-recover=all
